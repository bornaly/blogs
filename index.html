<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NextGen Threat Blog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; background: #f5f7fa; margin: 0; }
    header { background: #003366; color: white; text-align: center; padding: 40px 20px; }
    header h1 { font-size: 2.5em; margin: 0; }
    header p { font-size: 1.2em; margin-top: 10px; }
    .search-container { text-align: center; margin: 20px auto; }
    .search-container input { padding: 10px; width: 60%; max-width: 400px; font-size: 1em; border: 1px solid #ccc; border-radius: 8px; }
    .filter { text-align: center; margin: 10px; }
    .filter button { padding: 10px 15px; margin: 5px; border: none; background: #007acc; color: white; border-radius: 8px; cursor: pointer; }
    .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
    .card { background: white; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.07); overflow: hidden; transition: transform 0.3s ease; }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 180px; object-fit: cover; }
    .card-content { padding: 20px; }
    .card-content h2 { margin: 0 0 10px; font-size: 1.4em; color: #003366; }
    .meta { font-size: 0.85em; color: #777; margin-top: 8px; }
    footer { background: #003366; color: white; text-align: center; padding: 20px; font-size: 0.9em; margin-top: 40px; }
  </style>
</head>
<body>
  <header>
    <h1>NextGen Threat</h1>
    <p>Cybersecurity & Tech Insights by Faruk Ahmed</p>
  </header>
  <div class='search-container'>
    <input type='text' id='searchInput' onkeyup='filterPosts()' placeholder='Search blog titles...'>
  </div>
  <div class='filter'>
    <button onclick="filterTag('All')">All</button>
    <button onclick="filterTag('Python')">Python</button>
    <button onclick="filterTag('Linux')">Linux</button>
    <button onclick="filterTag('Bash')">Bash</button>
    <button onclick="filterTag('Cybersecurity')">Cybersecurity</button>
  </div>
  <div class='container' id='postContainer'>

    <div class='card' data-tags='Linux, Cybersecurity' data-title='10 security commands every linux admin should know (but probably doesn’t) | by faruk ahmed | apr, 2025 | medium'>
      <a href="https://medium.com/@bornaly/10-security-commands-every-linux-admin-should-know-but-probably-doesnt-02ad7afda229" target="_blank">
        <img src="https://miro.medium.com/v2/resize:fit:1200/1*LLlOnudxvyUu8r4fbguhww.png" alt="Post image">
      </a>
      <div class='card-content'>
        <h2><a href="https://medium.com/@bornaly/10-security-commands-every-linux-admin-should-know-but-probably-doesnt-02ad7afda229" target="_blank">10 Security Commands Every Linux Admin Should Know (But Probably Doesn’t) | by Faruk Ahmed | Apr, 2025 | Medium</a></h2>
        <div class='meta'>📅 2025-04-16 · ⏱️ 1 min read · 🏷️ Linux, Cybersecurity</div>
      </div>
    </div>

  </div>
  <footer>&copy; 2025 NextGen Threat · Built with ❤️ by Faruk Ahmed</footer>
  <script>
    const allPosts = document.querySelectorAll('.card');
    function filterPosts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      allPosts.forEach(post => {
        const title = post.getAttribute('data-title');
        post.style.display = title.includes(query) ? '' : 'none';
      });
    }
    function filterTag(tag) {
      allPosts.forEach(post => {
        const tags = post.getAttribute('data-tags');
        if (tag === 'All' || tags.includes(tag)) {
          post.style.display = '';
        } else {
          post.style.display = 'none';
        }
      });
    }
  </script>
</body>
</html>
